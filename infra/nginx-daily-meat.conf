# nginx site for the Daily Meat API v2 (the API container listens on 127.0.0.1:PORT, PORT from .env; keep proxy_pass in sync).
# Install:  sudo cp infra/nginx-daily-meat.conf /etc/nginx/sites-available/daily-meat
#           sudo ln -s /etc/nginx/sites-available/daily-meat /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d YOUR_DOMAIN     # adds the HTTPS server block + redirect

# An empty Connection header (plain requests) lets nginx keep the connection to the API open between requests
# instead of opening a new one each time; websocket upgrades still send "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream daily_meat_api {
    server 127.0.0.1:3000;             # keep in sync with PORT in .env
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 10m;          # product / banner image uploads (API limit is 5 MB per image)

    location / {
        proxy_pass http://daily_meat_api;
        proxy_http_version 1.1;

        # Socket.IO (live order + driver tracking) uses websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
