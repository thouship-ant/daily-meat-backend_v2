# nginx site that serves the catalog images from the MinIO container (127.0.0.1:9000) at https://YOUR_IMG_DOMAIN/<bucket>/<file>.
# Install:  sed 's/YOUR_IMG_DOMAIN/img.dailymeat.in/; s/BUCKET/dailymeat/' infra/nginx-images.conf | sudo tee /etc/nginx/sites-available/daily-meat-images
#           sudo ln -s /etc/nginx/sites-available/daily-meat-images /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d img.dailymeat.in
# Then in .env:  S3_PUBLIC_BASE_URL=https://img.dailymeat.in/dailymeat     (BUCKET = S3_BUCKET)
#
# Only GET / HEAD of a single file in the public bucket is allowed: no uploads, no bucket listing, and the private
# KYC bucket and the MinIO console are not reachable from outside.

proxy_cache_path /var/cache/nginx/dm-images levels=1:2 keys_zone=dm_images:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name YOUR_IMG_DOMAIN;

    location ~ "^/BUCKET/.+" {
        limit_except GET HEAD { deny all; }

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Images never change (every upload gets a new file name), so let phones and nginx keep them for a long time
        proxy_cache dm_images;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        return 404;
    }
}
